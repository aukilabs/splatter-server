name: Release Docker image

concurrency:
  group: splatter-server-tag-${{ github.ref_name }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android || true
          sudo apt-get clean
          docker system prune -af || true
          df -h

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Docker build and push
        env:
          DOCKER_BUILDKIT: "1"
          GLOBAL_AUKI_CHECKOUT_TOKEN: ${{ secrets.GLOBAL_AUKI_CHECKOUT_TOKEN }}
        run: |
          if [ -z "${GLOBAL_AUKI_CHECKOUT_TOKEN}" ]; then
            echo "::error::GLOBAL_AUKI_CHECKOUT_TOKEN is empty. Add this repo to that org secret's repository access."
            exit 1
          fi
          docker build \
            --secret id=github_token,env=GLOBAL_AUKI_CHECKOUT_TOKEN \
            --build-arg "SPLATTER_VERSION=${{ github.ref_name }}" \
            -t "aukilabs/splatter-server:latest" \
            -t "aukilabs/splatter-server:${{ github.ref_name }}" \
            -f Dockerfile \
            .
          docker push "aukilabs/splatter-server:latest"
          docker push "aukilabs/splatter-server:${{ github.ref_name }}"
